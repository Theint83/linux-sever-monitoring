<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Monitoring Dashboard</title>
    <!-- Chart.js CDN for Dynamic Charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 30px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            text-align: center;
            border-left: 5px solid #38bdf8;
        }
        .card h3 {
            margin: 0;
            font-size: 14px;
            color: #94a3b8;
            text-transform: uppercase;
        }
        .card .value {
            font-size: 28px;
            font-weight: bold;
            margin-top: 10px;
            color: #f1f5f9;
        }
        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .chart-card {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #1e293b;
            border-radius: 12px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        th {
            background-color: #334155;
            color: #38bdf8;
        }
        tr:hover {
            background-color: #334155;
        }
        .status-running { color: #4ade80; font-weight: bold; }
        .status-down { color: #f87171; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🖥️ Real-Time Server Monitoring Dashboard</h1>

    <!-- System Metrics Cards -->
    <div class="grid-container">
        <div class="card">
            <h3>CPU Usage</h3>
            <div class="value" id="cpu-usage">0%</div>
        </div>
        <div class="card">
            <h3>RAM Usage</h3>
            <div class="value" id="ram-usage">0 MB</div>
        </div>
        <div class="card">
            <h3>Disk Usage</h3>
            <div class="value" id="disk-usage">0 GB</div>
        </div>
        <div class="card">
            <h3>Uptime</h3>
            <div class="value" id="uptime">0s</div>
        </div>
        <div class="card">
            <h3>Network Status</h3>
            <div class="value" id="net-status">OFFLINE</div>
        </div>
        <div class="card" style="border-left-color: #f87171;">
            <h3>Security Alerts</h3>
            <div class="value" id="security-alerts" style="color: #f87171;">0</div>
        </div>
    </div>

    <!-- Live Charts -->
    <div class="charts-container">
        <div class="chart-card">
            <h3 style="color: #38bdf8; text-align: center;">CPU Usage Trend (%)</h3>
            <canvas id="cpuChart"></canvas>
        </div>
        <div class="chart-card">
            <h3 style="color: #38bdf8; text-align: center;">RAM Usage Trend</h3>
            <canvas id="ramChart"></canvas>
        </div>
    </div>

    <!-- Server Logs Table -->
    <h2 style="color: #38bdf8;">📋 Recent Server Logs</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Timestamp</th>
                <th>Log Message</th>
                <th>Level</th>
            </tr>
        </thead>
        <tbody id="logs-table-body">
            <tr><td colspan="4" style="text-align: center;">Loading logs...</td></tr>
        </tbody>
    </table>

    <script>
        // API URL ကို Browser ဖွင့်ထားသည့် IP/Hostname သို့ အလိုအလျောက် ယူမည်
        const API_URL = `http://${window.location.hostname}:5000/api/monitoring-data`;

        // Chart.js Setup
        const maxDataPoints = 10;
        const labels = [];
        const cpuData = [];
        const ramData = [];

        const cpuCtx = document.getElementById('cpuChart').getContext('2d');
        const cpuChart = new Chart(cpuCtx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'CPU Usage (%)',
                    data: cpuData,
                    borderColor: '#38bdf8',
                    backgroundColor: 'rgba(56, 189, 248, 0.2)',
                    fill: true,
                    tension: 0.3
                }]
            },
            options: { scales: { y: { beginAtZero: true, max: 100 } } }
        });

        const ramCtx = document.getElementById('ramChart').getContext('2d');
        const ramChart = new Chart(ramCtx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'RAM Usage',
                    data: ramData,
                    borderColor: '#a855f7',
                    backgroundColor: 'rgba(168, 85, 247, 0.2)',
                    fill: true,
                    tension: 0.3
                }]
            },
            options: { scales: { y: { beginAtZero: true } } }
        });

        // Fetch Data from Flask API
        async function fetchDashboardData() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("Network response was not ok");

                const data = await response.json();

                // 1. Update Cards
                const sys = data.system_resources || {};
                const net = data.network_stats || {};

                document.getElementById('cpu-usage').innerText = (sys.cpu_usage || 0) + '%';
                document.getElementById('ram-usage').innerText = (sys.ram_usage || 0) + ' MB';
                document.getElementById('disk-usage').innerText = (sys.disk_usage || 0) + ' GB';
                document.getElementById('uptime').innerText = sys.uptime || 'N/A';
                
                const netStatusElem = document.getElementById('net-status');
                netStatusElem.innerText = net.net_status || 'UNKNOWN';
                netStatusElem.className = 'value ' + (net.net_status === 'RUNNING' ? 'status-running' : 'status-down');

                document.getElementById('security-alerts').innerText = data.security_alerts || 0;

                // 2. Update Charts
                const now = new Date().toLocaleTimeString();
                if (labels.length >= maxDataPoints) {
                    labels.shift();
                    cpuData.shift();
                    ramData.shift();
                }
                labels.push(now);
                cpuData.push(sys.cpu_usage || 0);
                ramData.push(parseFloat(sys.ram_usage) || 0);

                cpuChart.update();
                ramChart.update();

                // 3. Update Logs Table
                const logsBody = document.getElementById('logs-table-body');
                logsBody.innerHTML = '';
                if (data.server_logs && data.server_logs.length > 0) {
                    data.server_logs.forEach(log => {
                        const row = `<tr>
                            <td>${log.id || '-'}</td>
                            <td>${log.timestamp || '-'}</td>
                            <td>${log.message || log.log_message || '-'}</td>
                            <td>${log.level || 'INFO'}</td>
                        </tr>`;
                        logsBody.innerHTML += row;
                    });
                } else {
                    logsBody.innerHTML = '<tr><td colspan="4" style="text-align: center;">No logs available</td></tr>';
                }

            } catch (error) {
                console.error("Error fetching monitoring data:", error);
            }
        }

        
        setInterval(fetchDashboardData, 5000);
        
        fetchDashboardData();
    </script>
</body>
</html>
